name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Compile integration
        run: python -m compileall custom_components/banlanx_ft001
      - name: Run unit tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/banlanx_ft001 -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
